<style>

  * { box-sizing: border-box; }

  .bg-grid { position:fixed; inset:0; z-index:0; pointer-events:none;

      linear-gradient(rgba(96,140,224,.055) 1px, transparent 1px),

    background-size:46px 46px;

    pointer-events:none; border-radius:50%;

    filter:blur(105px); opacity:.6; animation:spin 24s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .wrap { max-width:1480px; margin:0 auto; position:relative; z-index:1; }
  .kicker { font-size:11px; letter-spacing:.34em; color:#bcd0f5; text-transform:uppercase;

    background:linear-gradient(90deg,#22d3ee,#3b82f6); border-radius:2px; }

  #err { display:none; background:rgba(127,29,29,.16); border:1px solid rgba(248,113,113,.4); color:#fecaca;
    border-radius:8px; padding:16px; font-size:13px; margin-bottom:20px; }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#e9d5ff; }

  /* 工具栏 */

  .section::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;

  .section.sec-os::before { background:linear-gradient(180deg,#22d3ee,#3b82f6); }
  .section h2 { font-size:18px; margin:0 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#f0f4ff; }

  .tag.dom { background:linear-gradient(92deg,#3b82f6,#6366f1); }

  .cmp { width:16px; height:16px; cursor:pointer; accent-color:#c084fc; }
  /* 偏向能力列：彩色能力标签 */

  .footnote { margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);
    font-size:12px; color:var(--muted); }
  .toc { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; margin-bottom:24px; }

  /* 成本计算器 */

  .calc-note { font-size:12px; color:var(--muted); margin-bottom:10px; }

  .cmptag .x { cursor:pointer; color:#f0abfc; font-weight:700; }

    background:var(--panel); border-left:1px solid var(--border);
    box-shadow:-24px 0 60px rgba(5,2,18,.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transform:translateX(100%); transition:transform .3s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column; }
  .drawer.show { transform:translateX(0); }
  .drawer-hd { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px; border-bottom:1px solid var(--border); }

  .drawer-bd { padding:18px; overflow:auto; }
  .drawer-bd .calc-row { margin-bottom:16px; }

    margin:-6px 0 14px; }

  .panel-note { font-size:12px; color:var(--muted); margin:0 0 14px; line-height:1.6; }
  .panel-note b { color:#bcd0f5; font-weight:600; }
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .statcard { background:rgba(8,4,22,.4); border:1px solid var(--border); border-radius:12px; padding:14px 16px;
    position:relative; overflow:hidden; }
  .statcard::after { content:""; position:absolute; right:-20px; top:-20px; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle, rgba(59,130,246,.30), transparent 70%); }
  .statval { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(92deg,#7dd3fc,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .statval small { font-size:13px; font-weight:600; color:var(--muted); -webkit-text-fill-color:var(--muted); }
  .statlabel { font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:.02em; }
  .sub2 { font-size:14px; font-weight:700; color:#e7eefb; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
  .sub2::before { content:""; width:4px; height:15px; border-radius:3px; background:linear-gradient(180deg,#22d3ee,#3b82f6); }
  .barchart { display:flex; flex-direction:column; gap:7px; }
  .bar-row { display:grid; grid-template-columns:120px 1fr 96px; gap:10px; align-items:center; font-size:13px; }
  .bar-name { color:#e7eefb; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-name small { color:var(--muted); font-weight:400; margin-left:5px; }
  .bar-track { height:16px; background:rgba(8,4,22,.5); border-radius:999px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; box-shadow:0 0 12px rgba(59,130,246,.4); }
  .bar-val { text-align:right; font-variant-numeric:tabular-nums; color:#cfe6ff; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(8,4,22,.4); border:1px solid var(--border);

  .mkselect:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(96,140,224,.2); }

  /* 厂商导航侧边栏 */

    width:min(520px,94vw); max-height:86vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 22px 22px;

<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="wrap">
  <div class="kicker">LLM PRICING INTELLIGENCE · 13 VENDORS</div>
  <h1>模型调研<span class="badge">AI</span></h1>

  <!-- 工具栏 -->

<script>
let RATE = 7.2;                   // 1 $ ≈ 7.2 ¥（可编辑）
let DATA = null;
const STATE = { region:"all", q:"", sort:"default", auto:true, curMode:"CNY", useFilt:false,
                compare:new Set(), lastCheck:null };
const CUT = { q:"", rg:"all", cap:"", sort:"cutDesc" };   // 降幅速览筛选状态

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function parseNum(s){
  if(s==null) return null;
  s = String(s);
  if(/免费/.test(s) || s.trim() in {"":"","—":"","-":""}) return null;
  let m = s.replace(/,/g).match(/-?\d+\.?\d*/);
  return m ? parseFloat(m[0]) : null;
}
function toCNY(v, cur){ return cur==="$" ? v*RATE : v; }
// 币种显示：CNY=统一折算¥；USD=统一折算$；RAW=按各模型原币种
function fmtMoney(v, cur){
  if(v==null) return "—";
  let val, sym;
  if(STATE.curMode==="RAW"){ val=v; sym=cur; }
  else if(STATE.curMode==="USD"){ val = cur==="$" ? v : v/RATE; sym="$"; }
  else { val = cur==="$" ? v*RATE : v; sym="¥"; }   // CNY
  let s = sym + (Math.abs(val)>=1 ? val.toFixed(2) : val.toFixed(4));
  if(STATE.curMode==="CNY" && cur==="$") s += ' <small>($'+v.toFixed(4)+')</small>';
  return s;
}
function cmp(a,b){ // null 排末尾
  if(a==null && b==null) return 0;
  if(a==null) return 1; if(b==null) return -1;
  return a-b;
}

// 数据富化
function enrich(){
  DATA.vendors.forEach(function(v){
    v.models.forEach(function(m){
      m._ain = parseNum(m.after_in); m._aout = parseNum(m.after_out);
      m._free = !!(m.free);
      m._coef = (m.coef!=null) ? m.coef : 1;
      m._key = v.vendor + "/" + m.model;
      m._caps = capList(m.cap);
    });
  });
}
function matchModel(v, m){
  if(STATE.region!=="all" && v.tag!==STATE.region) return false;
  if(STATE.q){
    let q = STATE.q.toLowerCase();
    if((m.model+" "+v.display+" "+v.series+" "+m._caps.join(" ")).toLowerCase().indexOf(q) < 0) return false;
  }
  return true;
}
function sortModels(list){
  if(STATE.sort==="ain")  list.sort(function(a,b){return cmp(a._ain,b._ain);});
  if(STATE.sort==="aout") list.sort(function(a,b){return cmp(a._aout,b._aout);});
  if(STATE.sort==="disc") list.sort(function(a,b){return a._coef-b._coef;});
  return list;
}

// ---------- 渲染 ----------
function renderStatic(){
  const meta = DATA.meta || {};
  document.getElementById("sub").textContent =
    "数据更新：" + (meta.updated||meta.generated||"") + " · 官网逐一核对：" + (meta.generated||"") +
    " · 价格单位：每百万 tokens（¥ 或 $）· 折扣为用户提供政策";

  let h = "";
  // 目录
  h += '<div class="toc">';
  const dom = DATA.vendors.filter(function(v){return v.tag==="dom";});
  const os = DATA.vendors.filter(function(v){return v.tag==="os";});
  h += '<div class="grp">国内</div>';
  dom.forEach(function(v){ h += '<a href="#'+esc(v.vendor)+'">'+esc(v.display)+'</a>'; });
  h += '<div class="grp">海外</div>';
  os.forEach(function(v){ h += '<a href="#'+esc(v.vendor)+'">'+esc(v.display)+'</a>'; });
  h += '</div>';
  h += '<div class="heat-legend">单元格按 <b style="color:#cfe6ff">折后价 ¥ 等效值</b> 高低着色（绿=便宜 · 黄=居中 · 红=贵）；折扣列按折扣力度绿色加深。价格文本随上方「币种」切换显示。</div>';

  // 成本计算器已改为右上角按钮 → 抽屉（见 #calcDrawer）

  // 各模型降幅速览（卡片墙）
  h += '<div class="section" id="cutWall"><h2 style="font-size:17px;margin:0 0 6px;">📉 各模型降幅速览 <span style="font-weight:400;font-size:12px;color:var(--muted);">标牌价 → 折后价 落差排行</span></h2>';
  h += '<div class="panel-note">降幅 =（1 − 折扣系数）×100%，按当前「币种」显示折后价；免费模型与未打折模型不计入排行。点击卡片看明细，勾选可加入对比。</div>';
  h += '<div class="ph-row">'
     + '<input type="search" id="cutQ" placeholder="搜索模型 / 厂商 / 能力" style="min-width:200px" />'
     + '<select id="cutRg"><option value="all">全部</option><option value="dom">国内</option><option value="os">海外</option></select>'
     + '<select id="cutCap"><option value="">能力：全部</option></select>'
     + '<select id="cutSort"><option value="cutDesc">降幅最高在前</option><option value="cutAsc">降幅最低在前</option><option value="aoutAsc">折后输出价 低→高</option><option value="ainAsc">折后输入价 低→高</option></select>'
     + '</div>';
  h += '<div class="cutgrid" id="cutCards"></div>';
  h += '<div class="footnote" id="cutFoot"></div></div>';

  // 行业数据概览
  h += '<div class="section"><h2 style="font-size:17px;margin:0 0 6px;">📊 行业数据概览 <span style="font-weight:400;font-size:12px;color:var(--muted);">实时按当前价格计算</span></h2>';
  h += '<div class="panel-note">基于全部在售模型（免费模型计入数量但不计入均价）。价格统一折算 <b>¥/百万 tokens</b>。</div>';
  h += '<div class="statgrid" id="ovStats"></div>';
  h += '<div class="sub2">各厂商平均折后输出价</div>';
  h += '<div class="barchart" id="ovBars"></div>';
  h += '<div class="sub2">性价比两端</div>';
  h += '<div id="ovCheap"></div><div id="ovExp"></div>';
  h += '<div class="sub2">折扣覆盖</div>';
  h += '<div id="ovFree"></div></div>';

  // 对比面板（默认隐藏）
  h += '<div class="section" id="compare"><h2 style="font-size:17px;margin:0 0 10px;">🔍 模型对比 <button class="btn" id="cmpClear">清空</button></h2>';
  h += '<div id="cmpTags"></div>';
  h += '<div class="scroll"><table id="cmpTable"></table></div></div>';

  // 模型历史价格波动
  h += '<div class="section"><h2 style="font-size:17px;margin:0 0 6px;">📈 模型历史价格波动 <span style="font-weight:400;font-size:12px;color:var(--muted);">输入 / 输出 折后价走势</span></h2>';
  h += '<div class="panel-note" id="histNote">加载中…</div>';
  h += '<div class="hist-tools"><label style="font-size:12px;color:var(--muted);">选择模型 <select class="mkselect" id="histSel"></select></label>'
     + '<span class="legend"><span><i style="background:#38bdf8"></i>折后输入</span><span><i style="background:#a78bfa"></i>折后输出</span></span></div>';
  h += '<div class="chartbox"><div id="histChart"></div></div>';
  h += '<div class="statgrid" id="histStats" style="margin-top:14px;"></div></div>';

  // 页脚
  h += '<div class="section"><div class="footnote" style="border:0;margin:0;padding:0;color:var(--muted);font-size:12px;line-height:1.7;">'
     + '数据采集 '+(meta.generated||"")+'，模型与折扣政策变动频繁，正式大批量采购前请回官方页与商务二次确认。'
     + (meta.currency_note?('<br>'+esc(meta.currency_note)):"") + '</div></div>';

  document.getElementById("app").innerHTML = h;

  // 厂商导航侧边栏
  let sn = '<div class="grp">国内</div>';
  dom.forEach(function(v){ sn += '<a href="#'+esc(v.vendor)+'">'+esc(v.display)+'</a>'; });
  sn += '<div class="grp">海外</div>';
  os.forEach(function(v){ sn += '<a href="#'+esc(v.vendor)+'">'+esc(v.display)+'</a>'; });
  const snEl = document.getElementById("sidenav"); if(snEl) snEl.innerHTML = sn;
}

// 重组 app：static 部分已在 DOM，这里仅替换厂商列表；为简单起见整体重渲染
let _staticHTML = "";
function renderAll(){
  renderStatic();
  _staticHTML = document.getElementById("app").innerHTML;
  buildHeatScale();
  drawVendorsInto();
  drawCalc();
  drawCompare();
  drawOverview();
  drawHistory();
  document.getElementById("loading").style.display = "none";
}
function drawVendorsInto(){
  let h = "";
  DATA.vendors.forEach(function(v){
    let models = v.models.filter(function(m){ return matchModel(v, m); });
    if(STATE.q && models.length===0) return;
    models = sortModels(models.slice());
    h += '<div class="section '+(v.tag==="dom"?"sec-dom":"sec-os")+'" id="'+esc(v.vendor)+'">';
    h += '<h2>'+esc(v.display)+' <span class="tag '+v.tag+'">'+(v.tag==="dom"?"国内":"海外")+'</span> '
       + '<span style="font-weight:400;font-size:13px;color:var(--muted);">'+esc(v.series||"")+'</span>'
       + (v.source ? ' <a class="srclink" href="'+esc(v.source)+'" target="_blank" rel="noopener">官方定价页 ↗</a>' : '')
       + '</h2>';
    h += '<div class="desc">'+esc(v.desc||"")+'</div>';
    h += '<div class="scroll"><table>';
    h += '<thead><tr><th></th><th>模型</th><th>偏向能力</th><th>上下文</th><th>最大输出</th><th>输入单价</th><th>输出单价</th><th>缓存命中</th><th>折扣</th><th>折后输入</th><th>折后输出</th></tr></thead><tbody>';
    models.forEach(function(m){
      const cache = m.cache;
      const cacheCls = (cache==="—"||cache==="-"||cache===""||(cache&&cache.indexOf("免费")>=0)) ? ' class="na"' : "";
      const checked = STATE.compare.has(m._key) ? " checked" : "";
      const inS = heatColor(cnyVal(m,"in_v"), HEAT.inMin, HEAT.inMax);
      const outS = heatColor(cnyVal(m,"out_v"), HEAT.outMin, HEAT.outMax);
      const ainS = heatColor(cnyVal(m,"after_in_v"), HEAT.inMin, HEAT.inMax);
      const aoutS = heatColor(cnyVal(m,"after_out_v"), HEAT.outMin, HEAT.outMax);
      const dS = discColor(m.coef);
      h += '<tr>'
        + '<td><input type="checkbox" class="cmp" data-key="'+esc(m._key)+'"'+checked+' /></td>'
        + '<td class="model">'+esc(m.model)+'</td>'
        + '<td class="caps">'+capChips(m.cap)+'</td>'
        + '<td>'+esc(m.context)+'</td><td>'+esc(m.max_output)+'</td>'
        + '<td class="price" style="'+inS+'" title="'+esc(m.input)+'">'+fmtMoney(m.in_v, m.cur)+'</td>'
        + '<td class="price" style="'+outS+'" title="'+esc(m.output)+'">'+fmtMoney(m.out_v, m.cur)+'</td>'
        + '<td class="price"'+cacheCls+' title="'+esc(cache)+'">'+esc(cache)+'</td>'
        + '<td class="disc" style="'+dS+'" title="'+esc(m.discount)+'">'+esc(m.discount)+'</td>'
        + '<td class="price disc-col" style="'+ainS+'" title="'+esc(m.after_in)+'">'+fmtMoney(m.after_in_v, m.cur)+'</td>'
        + '<td class="price disc-col" style="'+aoutS+'" title="'+esc(m.after_out)+'">'+fmtMoney(m.after_out_v, m.cur)+'</td>'
        + '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="footnote">'+esc(v.footnote||"")+'</div>';
    h += '</div>';
  });
  // 用占位替换：把 _staticHTML 中的「对比面板」section 之前插入厂商
  // _staticHTML 结构：折扣表 + 目录 + 计算器 + 对比(section#compare) + 页脚
  // 在 #compare 前插入厂商
  const marker = '<div class="section" id="compare">';
  const idx = _staticHTML.indexOf(marker);
  const head = idx>=0 ? _staticHTML.slice(0, idx) : _staticHTML;
  const tail = idx>=0 ? _staticHTML.slice(idx) : "";
  document.getElementById("app").innerHTML = head + h + tail;
  renderCutWall();   // 主表重渲染会重置 #app，卡片墙需同步重建
}

function selectedModels(){
  let list = [];
  DATA.vendors.forEach(function(v){
    v.models.forEach(function(m){
      if(STATE.compare.has(m._key)) list.push({v:v, m:m});
    });
  });
  return list;
}
function drawCompare(){
  const box = document.getElementById("compare");
  if(!box) return;
  const sel = selectedModels();
  document.getElementById("tCmp").textContent = "对比 (" + sel.length + ")";
  let tags = "";
  sel.forEach(function(it){
    tags += '<span class="cmptag"><b>'+esc(it.m.model)+'</b> <span class="x" data-key="'+esc(it.m._key)+'">✕</span></span>';
  });
  document.getElementById("cmpTags").innerHTML = tags || '<span class="calc-note">勾选表格左侧复选框，把模型加入对比（可跨厂商）。</span>';

  let ht = '<thead><tr><th>厂商</th><th>模型</th><th>偏向能力</th><th>上下文</th><th>折后输入</th><th>折后输出</th><th>折扣</th><th>月成本*</th></tr></thead><tbody>';
  const vin = parseFloat(document.getElementById("cVin").value)||0;
  const vout = parseFloat(document.getElementById("cVout").value)||0;
  sel.forEach(function(it){
    const m = it.m;
    let cost = (m._free) ? {v:0, cur:m.cur} : {
      v: (m._ain!=null?m._ain:0)*vin + (m._aout!=null?m._aout:0)*vout, cur:m.cur };
    ht += '<tr><td>'+esc(it.v.display)+'</td><td class="model">'+esc(m.model)+'</td><td class="caps">'+capChips(m.cap)+'</td><td>'+esc(m.context)
        + '</td><td class="price">'+esc(m.after_in)+'</td><td class="price">'+esc(m.after_out)
        + '</td><td class="disc">'+esc(m.discount)+'</td><td class="price">'+fmtMoney(cost.v, cost.cur)+'</td></tr>';
  });
  ht += '</tbody>';
  document.getElementById("cmpTable").innerHTML = ht;
}

function drawCalc(){
  const vin = parseFloat(document.getElementById("cVin").value)||0;
  const vout = parseFloat(document.getElementById("cVout").value)||0;
  const mode = STATE.curMode;
  const dval = function(it){ // 排序/条长所用等效数值：USD 按$等效，其余按¥等效
    if(mode==="USD") return it.cur==="$" ? it.v : it.v/RATE;
    return it.cny;
  };
  let list = [];
  DATA.vendors.forEach(function(v){
    v.models.forEach(function(m){
      if(STATE.useFilt && !matchModel(v, m)) return;
      if(m._free){ list.push({m:m, v:0, cur:m.cur, cny:0}); return; }
      const ain = m._ain!=null?m._ain:0, aout = m._aout!=null?m._aout:0;
      const native = ain*vin + aout*vout;
      list.push({m:m, v:native, cur:m.cur, cny: toCNY(native, m.cur)});
    });
  });
  list.sort(function(a,b){ return dval(a)-dval(b); });
  const max = Math.max.apply(null, list.map(dval).concat([1]));
  const top = list.slice(0, 25);
  let h = "";
  top.forEach(function(it){
    const val = dval(it);
    const pct = Math.max(2, Math.round(val/max*100));
    h += '<div class="costitem"><div class="nm">'+esc(it.m.model)
       + '<small>'+esc(it.m._key.split("/")[0])+'</small></div>'
       + '<div class="costbar" style="width:'+pct+'%"></div>'

let HIST = null;          // 历史快照（price_history.json）
let HEAT = null;          // 折后价对数刻度区间
function cnyVal(m, f){
  const v = m[f];
  if(v==null) return null;
  return m.cur==="$" ? v*RATE : v;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function heatColor(v, lo, hi){
  if(v==null || v<=0 || !lo || !hi) return "";
  let t = (Math.log(v)-lo)/(hi-lo);
  t = Math.max(0, Math.min(1, t));
  let r,g,b;
  if(t < 0.5){ const k=t/0.5; r=lerp(52,251,k); g=lerp(211,191,k); b=lerp(153,36,k); }
  else { const k=(t-0.5)/0.5; r=lerp(251,248,k); g=lerp(191,113,k); b=lerp(36,113,k); }
  return "background:rgba("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+",.17)";
}
function discColor(coef){
  if(coef==null) return "";
  const t = Math.max(0, Math.min(0.6, 1-coef)); // 折扣越深越绿
  return "background:rgba(52,211,153,"+(0.05+0.30*t).toFixed(3)+")";
}
function buildHeatScale(){
  const ain=[], aout=[];
  DATA.vendors.forEach(function(v){ v.models.forEach(function(m){
    const a=cnyVal(m,"after_in_v"), b=cnyVal(m,"after_out_v");
    if(a!=null) ain.push(a); if(b!=null) aout.push(b);
  });});
  const lg = function(arr){ const a=arr.map(Math.log); return [Math.min.apply(null,a), Math.max.apply(null,a)]; };
  const i=lg(ain), o=lg(aout);
  HEAT = { inMin:i[0], inMax:i[1], outMin:o[0], outMax:o[1] };
}

// ---------- 历史波动 ----------
function lineSVG(dates, series){
  const W=680, H=240, padL=44, padR=14, padT=16, padB=28;
  const iw=W-padL-padR, ih=H-padT-padB;
  // y 范围
  let vals=[];
  series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) vals.push(v); }); });
  if(!vals.length) return '<div style="color:var(--muted);padding:20px">该模型暂无数值历史</div>';
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(hi===lo){ hi=lo*1.1+1e-6; lo=lo*0.9; }
  const n=dates.length;
  const x = function(i){ return padL + (n<=1?iw/2:iw*i/(n-1)); };
  const y = function(v){ return padT + ih*(1-(v-lo)/(hi-lo)); };
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
  // 网格 + y 轴标签
  for(let k=0;k<=4;k++){
    const yy=padT+ih*k/4, vv=hi-(hi-lo)*k/4;
    g+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="rgba(96,140,224,.14)"/>';
    g+='<text x="'+(padL-6)+'" y="'+(yy+4)+'" fill="#8fa6c8" font-size="10" text-anchor="end">¥'+(vv>=1?vv.toFixed(0):vv.toFixed(2))+'</text>';
  }
  // x 轴标签（隔点）
  dates.forEach(function(d,i){
    if(n>6 && i%2===1) return;
    const xx=x(i);
    g+='<text x="'+xx+'" y="'+(H-8)+'" fill="#8fa6c8" font-size="10" text-anchor="middle">'+d.slice(5)+'</text>';
  });
  // 折线
  series.forEach(function(s){
    let pts=[], started=false;
    s.values.forEach(function(v,i){ if(v==null){ if(pts.length>1){ g+=pathSeg(pts,s.color); } pts=[]; return; }
      pts.push([x(i),y(v)]); });
    if(pts.length>1) g+=pathSeg(pts,s.color);
    // 末端圆点
    const last=s.values.map(function(v,i){return v==null?null:[i,v];}).filter(Boolean).pop();
    if(last) g+='<circle cx="'+x(last[0])+'" cy="'+y(last[1])+'" r="3.5" fill="'+s.color+'"/>';
  });
  g+='</svg>';
  return g;
}
function pathSeg(pts,color){
  let d="M"+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length;i++) d+=" L"+pts[i][0]+" "+pts[i][1];
  return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px '+color+'99)"/>';
}
function drawHistory(){
  const sel=document.getElementById("histSel");
  if(!HIST || !HIST.dates || !HIST.dates.length){
    document.getElementById("histNote").innerHTML="尚未生成历史快照（price_history.json 缺失）。";
    document.getElementById("histChart").innerHTML=""; return;

    const opts=[];

    });});

    sel.innerHTML = opts.map(function(o){return '<option value="'+esc(o.key)+'">'+esc(o.label)+'</option>';}).join("");
    if(!sel.value && opts.length) sel.value=opts[0].key;

    ? '含 <b>'+(HIST.dates.length)+'</b> 个周度点（'+HIST.dates[0]+' → '+HIST.dates[HIST.dates.length-1]+'），其中早期为<b>示例回溯</b>，本日起每次更新自动追加真实快照。'
    : '已记录 <b>'+HIST.dates.length+'</b> 个快照（'+HIST.dates[0]+' → '+HIST.dates[HIST.dates.length-1]+'）。';

function drawHistoryChart(){
  const sel=document.getElementById("histSel");
  const key=sel.value;
  const ser=HIST.models[key];
  if(!ser){ document.getElementById("histChart").innerHTML="<div style='color:var(--muted);padding:20px'>该模型无历史</div>"; return; }
  document.getElementById("histChart").innerHTML = lineSVG(HIST.dates, [
    {name:"折后输入", color:"#38bdf8", values:ser.ai},
    {name:"折后输出", color:"#a78bfa", values:ser.ao}
  ]);
  // 统计卡
  const nums=ser.ao.filter(function(v){return v!=null;});
  if(nums.length){
    const cur=ser.ao[ser.ao.length-1], first=nums[0];
    const chg = first? (cur-first)/first*100 : 0;
    const cls = chg>=0? "up":"down";
    const arrow = chg>=0? "▲":"▼";
    let s="";
    s+=statCard("¥"+cur.toFixed(2), "当前折后输出");
    s+=statCard("¥"+Math.min.apply(null,nums).toFixed(2), "区间最低");
    s+=statCard("¥"+Math.max.apply(null,nums).toFixed(2), "区间最高");
    s+=statCard('<span class="'+cls+'">'+arrow+' '+Math.abs(chg).toFixed(1)+'%</span>', "区间涨跌（输出）");
    document.getElementById("histStats").innerHTML=s;
  }
}

// ---------- 事件 ----------
function bindUI(){
  document.getElementById("tRegion").addEventListener("change", function(e){ STATE.region=e.target.value; drawVendorsInto(); });
  document.getElementById("tQ").addEventListener("input", function(e){ STATE.q=e.target.value.trim(); drawVendorsInto(); });
  document.getElementById("tSort").addEventListener("change", function(e){ STATE.sort=e.target.value; drawVendorsInto(); });
  document.getElementById("tAuto").addEventListener("change", function(e){ STATE.auto=e.target.checked; updateStatus(); });
  document.getElementById("tFilt").addEventListener("change", function(e){ STATE.useFilt=e.target.checked; drawCalc(); });
  // 币种三模式 + 汇率
  document.getElementById("curSeg").addEventListener("click", function(e){
    const b = e.target.closest("button[data-c]"); if(!b) return;
    STATE.curMode = b.dataset.c;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle("on", x===b); });
    rerenderCurrency();
  });
  document.getElementById("fxRate").addEventListener("input", function(e){
    RATE = parseFloat(e.target.value)||7.2;
    buildHeatScale(); drawVendorsInto(); drawCalc(); drawCompare(); renderCutWall();
  });
  function rerenderCurrency(){ drawVendorsInto(); drawCalc(); drawCompare(); renderCutWall(); }
  // 降幅速览筛选
  document.getElementById("cutQ").addEventListener("input", function(e){ CUT.q=e.target.value.trim(); renderCutWall(); });
  document.getElementById("cutRg").addEventListener("change", function(e){ CUT.rg=e.target.value; renderCutWall(); });
  document.getElementById("cutCap").addEventListener("change", function(e){ CUT.cap=e.target.value; renderCutWall(); });
  document.getElementById("cutSort").addEventListener("change", function(e){ CUT.sort=e.target.value; renderCutWall(); });
  document.getElementById("cutCards").addEventListener("click", function(e){
    const chk = e.target.closest(".cmpchk");
    if(chk){
      const k = chk.querySelector("input").getAttribute("data-key");
      const cb = chk.querySelector("input");
      if(cb.checked) STATE.compare.add(k); else STATE.compare.delete(k);
      document.getElementById("tCmp").textContent = "对比 ("+STATE.compare.size+")";
      drawCompare(); return;
    }
    const card = e.target.closest(".cutcard");
    if(card) openCutDetail(card.getAttribute("data-vendor"), card.getAttribute("data-model"));
  });
  document.getElementById("cutMClose").addEventListener("click", closeCutDetail);
  document.getElementById("cutMask").addEventListener("click", closeCutDetail);
  document.getElementById("tRefresh").addEventListener("click", function(){ checkUpdate(true); });
  document.getElementById("tCmp").addEventListener("click", function(){ document.getElementById("compare").classList.toggle("show"); });
  document.getElementById("tCalc").addEventListener("click", openCalc);
  document.getElementById("calcClose").addEventListener("click", closeCalc);
  document.getElementById("calcMask").addEventListener("click", closeCalc);
  document.getElementById("tDisc").addEventListener("click", openDisc);
  document.getElementById("discClose").addEventListener("click", closeDisc);
  document.getElementById("discMask").addEventListener("click", closeDisc);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeCalc(); closeDisc(); closeCutDetail(); } });
  document.getElementById("cVin").addEventListener("input", function(){ drawCalc(); drawCompare(); });
  document.getElementById("cVout").addEventListener("input", function(){ drawCalc(); drawCompare(); });
  document.getElementById("app").addEventListener("change", function(e){
    if(e.target.classList.contains("cmp")){
      const k = e.target.getAttribute("data-key");
      if(e.target.checked){ STATE.compare.add(k); document.getElementById("compare").classList.add("show"); }
      else STATE.compare.delete(k);
      drawCompare();
    }
  });
  document.getElementById("app").addEventListener("click", function(e){
    if(e.target.classList.contains("x")){
      const k = e.target.getAttribute("data-key");
      STATE.compare.delete(k);
      // 同步表格复选框
      const cb = document.querySelector('input.cmp[data-key="'+CSS_escape(k)+'"]');
      if(cb) cb.checked=false;
      drawCompare();
    }
    if(e.target.id==="cmpClear"){ STATE.compare.clear();
      document.querySelectorAll("input.cmp").forEach(function(c){ c.checked=false; });
      drawCompare();
    }
  });
}
function CSS_escape(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/"/g,'\\"'); }

// ---------- 启动 ----------
fetch("prices.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(j){
    DATA=j; enrich();
    return fetch("price_history.json?t="+Date.now(), {cache:"no-store"})
      .then(function(h){ return h.json(); }).catch(function(){ return null; })
      .then(function(h){ HIST=h; });
  })
  .then(function(){ renderAll(); bindUI(); updateStatus();
    setInterval(function(){ if(STATE.auto) checkUpdate(true); }, 120000); })
  .catch(function(e){
    document.getElementById("loading").style.display="none";
    const err=document.getElementById("err"); err.style.display="block";
    err.innerHTML="无法加载 <code>prices.json</code>："+esc(e.message)
      +"。<br>若直接双击打开本文件（file://），浏览器会拦截本地 fetch；请通过部署后的网址访问。";
  });
</script>
</body>
</html>
